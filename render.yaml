# ============================================================
#  KmerMarket — API backend (Node.js + Express + PostgreSQL)
#  Déploiement Render : https://render.com/docs/blueprint-spec
# ============================================================

services:
  # ---------- Base de données PostgreSQL managée ----------
  - type: pserv
    name: kmermarket-db
    env: docker
    plan: free
    ipAllowList: [] # accès depuis les services Render uniquement

  # ---------- API REST ----------
  - type: web
    name: kmermarket-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injecte automatiquement DATABASE_URL via fromDatabase.
      - key: DATABASE_URL
        fromDatabase:
          name: kmermarket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # ⚠️ À remplacer après le déploiement du frontend (URL Vercel) :
      - key: CORS_ORIGIN
        value: https://kmer-market.vercel.app
      - key: ADMIN_FIRST_NAME
        value: Admin
      - key: ADMIN_LAST_NAME
        value: KmerMarket
      - key: ADMIN_EMAIL
        value: admin@kmermarket.cm
      - key: ADMIN_PHONE
        value: +237 6 99 00 11 22
      # ⚠️ Mot de passe admin initial — changez-le après la première connexion.
      - key: ADMIN_PASSWORD
        generateValue: true
